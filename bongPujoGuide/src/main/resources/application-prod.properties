# Production profile — loaded when SPRING_PROFILES_ACTIVE=prod

# Database — requires these env vars to be set in Railway (no fallback intentional)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# JPA — no SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true

# Disable open-in-view to prevent lazy-loading issues outside transactions
spring.jpa.open-in-view=false

# Logging — keep application logs at INFO, suppress noisy framework logs
logging.level.root=WARN
logging.level.com.bongpujoguide=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
