spring.application.name=bongPujoGuide

# Database
# Supports three setups:
#   1. Local dev         — falls back to localhost defaults
#   2. Railway Postgres  — reads PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD injected by Railway plugin
#   3. Explicit override — set DB_URL, DB_USERNAME, DB_PASSWORD directly
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bongpujoguide}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}
