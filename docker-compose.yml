services:
  postgres:
    image: postgres:16-alpine
    container_name: bongpujoguide-postgres
    environment:
      POSTGRES_DB: bongpujoguide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bongpujoguide"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bongpujoguide-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bongpujoguide
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
